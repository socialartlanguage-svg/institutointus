<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel interno — Intus</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/intus.css">
<style>
.wrap { max-width: 560px; margin: 0 auto; padding: 90px 32px 120px; }
.wrap h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 32px; color: var(--escuro); margin-bottom: 10px; }
.wrap > p { font-size: 15px; color: var(--muted); margin-bottom: 40px; }
form { display: flex; flex-direction: column; gap: 20px; }
label { font-size: 13px; color: var(--mark-dark); margin-bottom: 6px; display: block; }
input {
  width: 100%; padding: 13px 16px; border: 1px solid rgba(100,86,70,0.3);
  background: rgba(255,255,255,0.4); font-family: 'Inter', sans-serif; font-size: 15px;
  color: var(--texto); border-radius: 2px;
}
input:focus { outline: none; border-color: var(--mark); }
.btn { align-self: flex-start; }
.resultado { margin-top: 28px; padding: 18px 20px; border-radius: 2px; font-size: 14px; display: none; }
.resultado.sucesso { display: block; background: var(--bege); color: var(--mark-dark); }
.resultado.erro { display: block; background: #f3dcd6; color: #8A3B2E; }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo"><span class="logo-arco" aria-hidden="true"></span>Intus</a>
  </div>
</header>

<section class="wrap">
  <p class="eyebrow">Uso interno</p>
  <h1>Confirmar pagamento e liberar pacote</h1>
  <p>Use depois de ver o pagamento confirmado no painel do InfinitePay. Isso cria o paciente e o pacote ativo no sistema.</p>

  <form id="form-pacote">
    <div>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <div>
      <label for="nome">Nome da paciente</label>
      <input type="text" id="nome" name="nome" required>
    </div>
    <div>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="whatsapp">WhatsApp</label>
      <input type="tel" id="whatsapp" name="whatsapp" required>
    </div>
    <button type="submit" class="btn">Confirmar pacote</button>
  </form>

  <div class="resultado" id="resultado" role="status"></div>
</section>

<script>
(function () {
  var form = document.getElementById('form-pacote');
  var resultado = document.getElementById('resultado');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var botao = form.querySelector('button[type="submit"]');
    botao.disabled = true;
    botao.textContent = 'Enviando…';
    resultado.className = 'resultado';
    resultado.textContent = '';

    fetch('/.netlify/functions/criar-paciente-pacote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        senha: form.senha.value,
        nome: form.nome.value,
        email: form.email.value,
        whatsapp: form.whatsapp.value
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.data.erro || 'Erro desconhecido');
        resultado.className = 'resultado sucesso';
        resultado.textContent = 'Pacote confirmado para ' + form.nome.value + '. Pode avisar a paciente e combinar o horário.';
        form.reset();
      })
      .catch(function (err) {
        resultado.className = 'resultado erro';
        resultado.textContent = 'Não deu certo: ' + err.message;
      })
      .finally(function () {
        botao.disabled = false;
        botao.textContent = 'Confirmar pacote';
      });
  });
})();
</script>

</body>
</html>
