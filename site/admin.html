<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel interno — Intus</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/intus.css">
<style>
.painel { max-width: 1040px; margin: 0 auto; padding: 56px 32px 120px; }
.painel h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 34px; color: var(--escuro); margin-bottom: 28px; }
.abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 36px; border-bottom: 1px solid var(--linha); }
.abas button { background: none; border: none; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--muted); padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.abas button.ativa { color: var(--escuro); border-bottom-color: var(--ouro); font-weight: 500; }
.abas .contador { background: var(--ouro); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; margin-left: 6px; }

.msg { padding: 13px 18px; border-radius: 2px; font-size: 14px; margin-bottom: 24px; display: none; }
.msg.ok { display: block; background: var(--bege); color: var(--mark-dark); border-left: 2px solid var(--ouro); }
.msg.ruim { display: block; background: #f3dcd6; color: #8A3B2E; }
.mini { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 2px; cursor: pointer; border: 1px solid var(--mark); background: transparent; color: var(--mark-dark); transition: all 0.2s; }
.mini:hover { background: var(--mark); color: var(--creme); }
.mini.cheio { background: var(--mark); color: var(--creme); }
.mini:disabled { opacity: 0.5; cursor: wait; }
.nota { font-size: 14px; color: var(--muted); margin-bottom: 18px; max-width: 640px; }

/* agenda */
.semana-nav { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.semana-nav strong { font-family: 'Fraunces', serif; font-weight: 400; font-size: 20px; color: var(--escuro); min-width: 190px; text-align: center; }
.atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.grade { display: grid; grid-template-columns: 58px repeat(5, 1fr); gap: 4px; }
.grade .cab { font-size: 12px; text-align: center; color: var(--mark-dark); padding: 6px 2px; text-transform: capitalize; }
.grade .cab button { display: block; margin: 6px auto 0; font-size: 11px; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; }
.grade .h { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.cel { height: 38px; border: 1px solid rgba(100,86,70,0.18); border-radius: 2px; background: rgba(100,86,70,0.06); color: transparent; font-size: 11px; cursor: pointer; transition: all 0.15s; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; }
.cel:hover { border-color: var(--mark); }
.cel.aberto { background: #cfdcc4; border-color: #9fb48d; color: #3d5230; }
.cel.ocupado { background: var(--mark-dark); border-color: var(--mark-dark); color: var(--creme); cursor: default; }
.cel.passado { opacity: 0.4; cursor: default; }
.legenda { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 14px; flex-wrap: wrap; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; }
.sessoes-semana { margin-top: 30px; }
.linha { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--linha); font-size: 15px; }
.linha:last-child { border-bottom: 1px solid var(--linha); }
.linha small { display: block; color: var(--muted); font-size: 13px; }

/* forms */
form.campos { display: flex; flex-direction: column; gap: 18px; max-width: 520px; }
form.campos label { font-size: 13px; color: var(--mark-dark); margin-bottom: 6px; display: block; }
form.campos input { width: 100%; padding: 13px 16px; border: 1px solid rgba(100,86,70,0.3); background: rgba(255,255,255,0.4); font: inherit; font-size: 15px; color: var(--texto); border-radius: 2px; }
form.campos input:focus { outline: none; border-color: var(--mark); }
.resultado { margin-top: 24px; padding: 20px 22px; background: var(--bege); border-left: 2px solid var(--ouro); border-radius: 2px; font-size: 15px; max-width: 520px; }
.resultado code { font-size: 17px; background: rgba(255,255,255,0.6); padding: 2px 8px; border-radius: 2px; user-select: all; }
.detalhe { background: rgba(255,255,255,0.4); border: 1px solid var(--linha); padding: 22px 26px; margin-top: 20px; border-radius: 2px; font-size: 14px; }
.detalhe h3 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 20px; margin-bottom: 10px; }
.detalhe p { margin-bottom: 6px; }
.detalhe .rot { color: var(--muted); }

#entrada { max-width: 380px; margin: 100px auto; padding: 0 24px; }
#entrada input { width: 100%; padding: 13px 16px; border: 1px solid rgba(100,86,70,0.3); background: rgba(255,255,255,0.4); font: inherit; font-size: 15px; border-radius: 2px; margin-bottom: 14px; }
#app { display: none; }

@media (max-width: 820px) { .painel { padding: 36px 16px 90px; } .grade { grid-template-columns: 44px repeat(5, 1fr); } .cel { height: 34px; } }
</style>
</head>
<body data-sem-whatsapp>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo"><span class="logo-arco" aria-hidden="true"></span>Intus</a>
    <a href="#" id="sair" style="font-size:14px;display:none">Sair do painel</a>
  </div>
</header>

<div id="entrada">
  <p class="eyebrow">Uso interno</p>
  <h1 style="font-family:'Fraunces',serif;font-weight:400;font-size:30px;margin-bottom:20px">Painel do Intus</h1>
  <form id="form-entrada">
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button class="mini cheio" type="submit">Entrar</button>
  </form>
  <div class="msg" id="msg-entrada" role="alert"></div>
</div>

<main class="painel" id="app">
  <h1>Painel interno</h1>
  <div class="abas" id="abas">
    <button data-aba="agenda" class="ativa">Agenda</button>
    <button data-aba="pacientes">Pacientes</button>
    <button data-aba="contestacoes">Contestações <span class="contador" id="contador" hidden></span></button>
    <button data-aba="liberar">Liberar pacote</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div id="vista"></div>
</main>

<script src="js/site.js"></script>
<script>
(function () {
  var TZ = 'America/Sao_Paulo', HORAS = [], i;
  for (i = 7; i <= 19; i++) HORAS.push(i);
  var DIAS = ['seg', 'ter', 'qua', 'qui', 'sex'];
  var senha = null, aba = 'agenda', semana = null, agenda = null;
  var elVista = document.getElementById('vista'), elMsg = document.getElementById('msg');

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function msg(texto, ruim) { elMsg.className = 'msg ' + (ruim ? 'ruim' : 'ok'); elMsg.textContent = texto; }
  function limpar() { elMsg.className = 'msg'; }
  function fmt(iso, opcoes) { return new Date(iso).toLocaleString('pt-BR', Object.assign({ timeZone: TZ }, opcoes)); }

  function api(acao, dados) {
    return fetch('/.netlify/functions/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': senha },
      body: JSON.stringify(Object.assign({ acao: acao }, dados || {}))
    }).then(function (r) {
      return r.json().then(function (d) {
        if (r.status === 401) { sessionStorage.removeItem('intus_admin'); window.location.reload(); throw new Error('Senha incorreta'); }
        if (!r.ok) throw new Error(d.erro || 'Erro');
        return d;
      });
    });
  }

  // ---------- entrada ----------
  function iniciar(s) {
    senha = s;
    document.getElementById('entrada').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sair').style.display = 'inline';
    contarContestacoes();
    abrirAba('agenda');
  }
  document.getElementById('form-entrada').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = document.getElementById('senha').value;
    senha = s;
    api('contestacoes').then(function () { sessionStorage.setItem('intus_admin', s); iniciar(s); })
      .catch(function () { var m = document.getElementById('msg-entrada'); m.className = 'msg ruim'; m.textContent = 'Senha incorreta.'; });
  });
  document.getElementById('sair').addEventListener('click', function (e) { e.preventDefault(); sessionStorage.removeItem('intus_admin'); window.location.reload(); });
  var guardada = sessionStorage.getItem('intus_admin');
  if (guardada) iniciar(guardada);

  document.getElementById('abas').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-aba]'); if (b) abrirAba(b.getAttribute('data-aba'));
  });
  function abrirAba(nome) {
    aba = nome; limpar();
    Array.prototype.forEach.call(document.querySelectorAll('#abas button'), function (b) { b.classList.toggle('ativa', b.getAttribute('data-aba') === nome); });
    ({ agenda: vistaAgenda, pacientes: vistaPacientes, contestacoes: vistaContestacoes, liberar: vistaLiberar })[nome]();
  }
  function contarContestacoes() {
    api('contestacoes').then(function (r) {
      var c = document.getElementById('contador'); c.textContent = r.contestacoes.length; c.hidden = !r.contestacoes.length;
    }).catch(function () {});
  }

  // ---------- datas da grade ----------
  function hojeLocal() { return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); } // YYYY-MM-DD
  function segundaDe(chave) {
    var p = chave.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    return d.toISOString().slice(0, 10);
  }
  function somarDias(chave, n) {
    var p = chave.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.toISOString().slice(0, 10);
  }
  function slotIso(chaveSegunda, dia, hora) { // horário de Brasília = UTC-3
    var p = somarDias(chaveSegunda, dia).split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2], hora + 3)).toISOString();
  }

  // ---------- agenda ----------
  function vistaAgenda() {
    if (!semana) semana = segundaDe(hojeLocal());
    elVista.innerHTML = '<p class="vazio">Carregando…</p>';
    api('agenda', { semana: semana }).then(function (r) { agenda = r; desenharAgenda(); }).catch(function (e) { msg(e.message, true); });
  }

  function desenharAgenda() {
    var abertos = {}, ocupados = {};
    agenda.slots.forEach(function (s) { abertos[s] = true; });
    agenda.sessoes.forEach(function (s) { ocupados[s.horario] = s; });
    var p = semana.split('-'), fim = somarDias(semana, 4).split('-');
    var agora = Date.now();

    var h = '<p class="nota">Clique nos horários para <strong>abrir</strong> (verde) ou fechar. Só horários abertos aparecem para as pacientes. Cada sessão tem 60 minutos.</p>' +
      (agenda.meet && agenda.meet.ok ? '' : '<div class="msg ruim" style="display:block">O Google Meet não está conectado: as sessões marcadas ficam sem link de videochamada.' + (agenda.meet && agenda.meet.erro ? ' (' + esc(agenda.meet.erro) + ')' : '') + '</div>') +
      '<div class="semana-nav"><button class="mini" id="ant">‹ Anterior</button><strong>' + p[2] + '/' + p[1] + ' a ' + fim[2] + '/' + fim[1] + '</strong><button class="mini" id="prox">Próxima ›</button><button class="mini" id="hoje">Hoje</button></div>' +
      '<div class="atalhos"><button class="mini" id="abrir-tudo">Abrir semana toda (7h–20h)</button><button class="mini" id="fechar-tudo">Fechar semana toda</button><button class="mini" id="copiar">Copiar da semana anterior</button></div>' +
      '<div class="grade"><div></div>';
    DIAS.forEach(function (nome, d) {
      var dd = somarDias(semana, d).split('-');
      h += '<div class="cab">' + nome + ' ' + dd[2] + '/' + dd[1] + '<button data-dia="' + d + '" data-op="abrir">abrir dia</button><button data-dia="' + d + '" data-op="fechar">fechar dia</button></div>';
    });
    HORAS.forEach(function (hora) {
      h += '<div class="h">' + hora + 'h</div>';
      DIAS.forEach(function (_, d) {
        var iso = slotIso(semana, d, hora), passado = new Date(iso).getTime() < agora;
        var cls = 'cel' + (ocupados[iso] ? ' ocupado' : abertos[iso] ? ' aberto' : '') + (passado ? ' passado' : '');
        var rotulo = ocupados[iso] ? esc(ocupados[iso].paciente.split(' ')[0]) : abertos[iso] ? 'aberto' : '';
        h += '<button class="' + cls + '" data-slot="' + iso + '"' + (ocupados[iso] || passado ? ' disabled' : '') + '>' + rotulo + '</button>';
      });
    });
    h += '</div><div class="legenda"><span><i style="background:rgba(100,86,70,0.15)"></i>fechado</span><span><i style="background:#cfdcc4"></i>aberto</span><span><i style="background:var(--mark-dark)"></i>sessão marcada</span></div>';

    h += '<div class="sessoes-semana"><h2 style="font-family:Fraunces,serif;font-weight:400;font-size:22px;margin-bottom:12px">Sessões da semana</h2>';
    if (!agenda.sessoes.length) h += '<p class="nota">Nenhuma sessão marcada nesta semana.</p>';
    agenda.sessoes.forEach(function (s) {
      h += '<div class="linha"><div>' + esc(s.paciente) + '<small>' + esc(fmt(s.horario, { weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) + '</small></div><div>' +
        (s.link_meet ? '<a class="mini" href="' + esc(s.link_meet) + '" target="_blank" rel="noopener" style="text-decoration:none">Meet</a> ' : '<small>sem link</small> ') +
        '<button class="mini" data-cancelar="' + s.id + '">Cancelar</button></div></div>';
    });
    elVista.innerHTML = h + '</div>';

    document.getElementById('ant').onclick = function () { semana = somarDias(semana, -7); vistaAgenda(); };
    document.getElementById('prox').onclick = function () { semana = somarDias(semana, 7); vistaAgenda(); };
    document.getElementById('hoje').onclick = function () { semana = segundaDe(hojeLocal()); vistaAgenda(); };
    document.getElementById('abrir-tudo').onclick = function () { alterarVarios(todos(function () { return true; }), []); };
    document.getElementById('fechar-tudo').onclick = function () { alterarVarios([], todos(function (iso) { return abertos[iso]; })); };
    document.getElementById('copiar').onclick = copiarSemanaAnterior;
    Array.prototype.forEach.call(elVista.querySelectorAll('[data-slot]'), function (b) {
      b.onclick = function () {
        var iso = b.getAttribute('data-slot');
        if (abertos[iso]) alterarVarios([], [iso]); else alterarVarios([iso], []);
      };
    });
    Array.prototype.forEach.call(elVista.querySelectorAll('[data-dia]'), function (b) {
      b.onclick = function () {
        var d = Number(b.getAttribute('data-dia')), lista = todos(function () { return true; }, d);
        if (b.getAttribute('data-op') === 'abrir') alterarVarios(lista, []);
        else alterarVarios([], lista.filter(function (iso) { return abertos[iso]; }));
      };
    });
    Array.prototype.forEach.call(elVista.querySelectorAll('[data-cancelar]'), function (b) {
      b.onclick = function () {
        if (!window.confirm('Cancelar esta sessão? A paciente é avisada pelo Google Agenda e não perde a sessão do pacote.')) return;
        api('cancelar_sessao', { sessao_id: b.getAttribute('data-cancelar') }).then(function () { msg('Sessão cancelada.'); vistaAgenda(); }).catch(function (e) { msg(e.message, true); });
      };
    });

    function todos(filtro, soDia) {
      var lista = [];
      DIAS.forEach(function (_, d) {
        if (soDia != null && soDia !== d) return;
        HORAS.forEach(function (hora) {
          var iso = slotIso(semana, d, hora);
          if (new Date(iso).getTime() > agora && !ocupados[iso] && filtro(iso)) lista.push(iso);
        });
      });
      return lista;
    }
  }

  function alterarVarios(abrir, fechar) {
    limpar();
    if (!abrir.length && !fechar.length) return;
    api('slots', { abrir: abrir, fechar: fechar }).then(vistaAgendaSemRecarregarMsg).catch(function (e) { msg(e.message, true); });
  }
  function vistaAgendaSemRecarregarMsg() { api('agenda', { semana: semana }).then(function (r) { agenda = r; desenharAgenda(); }); }

  function copiarSemanaAnterior() {
    var anterior = somarDias(semana, -7);
    api('agenda', { semana: anterior }).then(function (r) {
      var abrir = r.slots.map(function (iso) { return new Date(new Date(iso).getTime() + 7 * 86400000).toISOString(); });
      if (!abrir.length) return msg('A semana anterior não tinha horários abertos.', true);
      return api('slots', { abrir: abrir }).then(function () { msg('Horários copiados da semana anterior.'); vistaAgendaSemRecarregarMsg(); });
    }).catch(function (e) { msg(e.message, true); });
  }

  // ---------- pacientes ----------
  function vistaPacientes() {
    elVista.innerHTML = '<p class="vazio">Carregando…</p>';
    api('pacientes').then(function (r) {
      var h = '<p class="nota">Toque em uma paciente para ver as observações de saúde e o histórico.</p>';
      if (!r.pacientes.length) h += '<p class="nota">Nenhuma paciente cadastrada ainda. Use "Liberar pacote" depois de confirmar um pagamento.</p>';
      r.pacientes.forEach(function (p) {
        h += '<div class="linha"><div>' + esc(p.nome) + '<small>' + esc(p.email) + ' · ' + esc(p.whatsapp) + '</small></div><div>' +
          '<small style="display:inline;margin-right:12px">' + (p.termo_aceito ? 'termo ✓' : 'termo pendente') + ' · ' + (p.pacote_ativo ? p.usadas + ' de ' + p.total + ' sessões' : 'sem pacote ativo') + '</small>' +
          '<button class="mini" data-ver="' + p.id + '">Ver</button> <button class="mini" data-senha="' + p.id + '">Nova senha</button> <button class="mini" data-excluir="' + p.id + '" data-nome="' + esc(p.nome) + '">Excluir</button></div></div>';
      });
      elVista.innerHTML = h + '<div id="detalhe"></div>';
      Array.prototype.forEach.call(elVista.querySelectorAll('[data-ver]'), function (b) { b.onclick = function () { verPaciente(b.getAttribute('data-ver')); }; });
      Array.prototype.forEach.call(elVista.querySelectorAll('[data-excluir]'), function (b) {
        b.onclick = function () {
          var nome = b.getAttribute('data-nome');
          if (!window.confirm('EXCLUIR DEFINITIVAMENTE ' + nome + '? Apaga o acesso, as observações de saúde e todo o histórico de sessões. Não dá para desfazer.')) return;
          if (window.prompt('Para confirmar, digite EXCLUIR') !== 'EXCLUIR') return;
          api('excluir_paciente', { paciente_id: b.getAttribute('data-excluir') })
            .then(function () { msg('Paciente excluída.'); vistaPacientes(); }).catch(function (e) { msg(e.message, true); });
        };
      });
      Array.prototype.forEach.call(elVista.querySelectorAll('[data-senha]'), function (b) {
        b.onclick = function () {
          if (!window.confirm('Gerar uma nova senha provisória para esta paciente? A senha antiga deixa de valer.')) return;
          api('redefinir_senha', { paciente_id: b.getAttribute('data-senha') }).then(function (r) {
            document.getElementById('detalhe').innerHTML = '<div class="resultado">Nova senha para <strong>' + esc(r.email) + '</strong>:<br><code>' + esc(r.senha_provisoria) + '</code><br><small>Envie pelo WhatsApp. Ela troca no primeiro acesso.</small></div>';
          }).catch(function (e) { msg(e.message, true); });
        };
      });
    }).catch(function (e) { msg(e.message, true); });
  }

  var ROT = { agendada: 'Agendada', realizada: 'Realizada', cancelada: 'Cancelada', contestada: 'Contestação pendente' };
  function verPaciente(id) {
    api('paciente', { id: id }).then(function (r) {
      var o = r.observacoes, sn = function (v) { return v === true ? 'Sim' : v === false ? 'Não' : '—'; };
      var h = '<div class="detalhe"><h3>' + esc(r.paciente.nome) + '</h3><p class="rot">' + esc(r.paciente.email) + ' · ' + esc(r.paciente.whatsapp) + '</p>' +
        '<h3 style="margin-top:18px;font-size:17px">Termo de compromisso</h3>';
      if (!r.aceites.length) h += '<p class="rot">Ainda não aceitou nenhuma versão.</p>';
      r.aceites.forEach(function (a) {
        h += '<p>Versão ' + esc(a.versao) + (a.versao === r.termo_atual ? ' (atual)' : ' (antiga)') + ' — assinado por <strong>' + esc(a.nome_digitado) + '</strong> em ' + esc(fmt(a.aceito_em, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })) + '<br><span class="rot">IP ' + esc(a.ip || '—') + ' · hash ' + esc((a.texto_hash || '').slice(0, 12)) + '…</span></p>';
      });
      h += '<h3 style="margin-top:18px;font-size:17px">Observações de saúde</h3>';
      if (!o) h += '<p class="rot">A paciente ainda não preencheu.</p>';
      else h += '<p><span class="rot">Toma medicação:</span> ' + sn(o.toma_medicacao) + '</p><p><span class="rot">Medicamentos:</span> ' + esc(o.medicacoes || '—') + '</p>' +
        '<p><span class="rot">Acompanhamento psiquiátrico:</span> ' + sn(o.tem_psiquiatra) + '</p><p><span class="rot">Psiquiatra:</span> ' + esc(o.psiquiatra || '—') + '</p>' +
        '<p><span class="rot">Outras:</span> ' + esc(o.outras_observacoes || '—') + '</p>';
      h += '<h3 style="margin-top:18px;font-size:17px">Sessões</h3>';
      if (!r.sessoes.length) h += '<p class="rot">Nenhuma.</p>';
      r.sessoes.forEach(function (s) {
        var t = (s.status === 'agendada' && new Date(s.horario) < new Date()) ? 'Realizada' : (ROT[s.status] || s.status);
        if (s.status === 'cancelada' && s.cancelamento_tardio) t += ' (menos de 24h)';
        h += '<p>' + esc(fmt(s.horario, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })) + ' — ' + esc(t) + (s.motivo_contestacao ? '<br><span class="rot">Motivo: ' + esc(s.motivo_contestacao) + '</span>' : '') + '</p>';
      });
      document.getElementById('detalhe').innerHTML = h + '</div>';
      document.getElementById('detalhe').scrollIntoView({ behavior: 'smooth' });
    }).catch(function (e) { msg(e.message, true); });
  }

  // ---------- contestações ----------
  function vistaContestacoes() {
    elVista.innerHTML = '<p class="vazio">Carregando…</p>';
    api('contestacoes').then(function (r) {
      var h = '<p class="nota">Pacientes que cancelaram com menos de 24h e pediram para não perder a sessão. <strong>Aceitar</strong> devolve a sessão ao pacote; <strong>Recusar</strong> mantém como sessão realizada.</p>';
      if (!r.contestacoes.length) h += '<p class="nota">Nenhuma contestação pendente.</p>';
      r.contestacoes.forEach(function (c) {
        h += '<div class="linha"><div><strong>' + esc(c.paciente) + '</strong> — sessão de ' + esc(fmt(c.horario, { weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) +
          '<small>"' + esc(c.motivo) + '"</small></div><div><button class="mini cheio" data-d="aceita" data-id="' + c.id + '">Aceitar</button> <button class="mini" data-d="recusada" data-id="' + c.id + '">Recusar</button></div></div>';
      });
      elVista.innerHTML = h;
      Array.prototype.forEach.call(elVista.querySelectorAll('[data-d]'), function (b) {
        b.onclick = function () {
          api('decidir_contestacao', { sessao_id: b.getAttribute('data-id'), decisao: b.getAttribute('data-d') })
            .then(function () { msg('Decisão registrada.'); contarContestacoes(); vistaContestacoes(); }).catch(function (e) { msg(e.message, true); });
        };
      });
    }).catch(function (e) { msg(e.message, true); });
  }

  // ---------- liberar pacote ----------
  function vistaLiberar() {
    elVista.innerHTML = '<p class="nota">Use depois de ver o pagamento confirmado no painel do InfinitePay. Isso cria o acesso da paciente (ou renova o pacote, se ela já tiver conta).</p>' +
      '<form class="campos" id="form-liberar"><div><label for="nome">Nome da paciente</label><input type="text" id="nome" required></div>' +
      '<div><label for="email">E-mail</label><input type="email" id="email" required></div>' +
      '<div><label for="whatsapp">WhatsApp</label><input type="tel" id="whatsapp" required></div>' +
      '<button class="mini cheio" type="submit" style="align-self:flex-start">Confirmar pacote</button></form><div id="resultado"></div>';
    document.getElementById('form-liberar').addEventListener('submit', function (e) {
      e.preventDefault(); limpar();
      var f = e.target, b = f.querySelector('button'); b.disabled = true;
      api('liberar_pacote', { nome: f.nome.value, email: f.email.value, whatsapp: f.whatsapp.value }).then(function (r) {
        var h = r.senha_provisoria
          ? '<div class="resultado">Pacote liberado! Envie estes dados para a paciente pelo WhatsApp:<br><br>Acesso: <strong>institutointus.netlify.app/area-do-paciente.html</strong><br>E-mail: <strong>' + esc(r.email) + '</strong><br>Senha provisória: <code>' + esc(r.senha_provisoria) + '</code><br><br><small>Ela troca a senha no primeiro acesso. Essa senha só aparece agora — se perder, use "Nova senha" em Pacientes.</small></div>'
          : '<div class="resultado">Novo pacote liberado para <strong>' + esc(r.email) + '</strong>. Ela já tem acesso — é só avisar que o pacote foi renovado.</div>';
        document.getElementById('resultado').innerHTML = h; f.reset();
      }).catch(function (err) { msg(err.message, true); }).then(function () { b.disabled = false; });
    });
  }
})();
</script>
</body>
</html>
