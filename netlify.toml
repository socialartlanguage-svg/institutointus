[build]
  publish = "site"
  functions = "netlify/functions"
  # Só publica quando algo que vai ao ar mudou (site, funções, dependências, esta config).
  # Mudanças só em HANDOFF, scripts, documentação etc. não gastam crédito de deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify package.json package-lock.json netlify.toml"
